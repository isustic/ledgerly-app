name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build for Windows (.exe / .msi)'
        required: true
        type: boolean
        default: true
      build_macos:
        description: 'Build for macOS (.dmg / .app)'
        required: true
        type: boolean
        default: true
      build_linux:
        description: 'Build for Linux (.AppImage / .deb)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: "windows"
            os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          # macOS (Apple Silicon)
          - platform: "macos"
            os: "macos-latest"
            target: "aarch64-apple-darwin"
          # Linux (x64)
          - platform: "linux"
            os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        if: >-
          github.event_name != 'workflow_dispatch' ||
          (matrix.platform == 'windows' && inputs.build_windows) ||
          (matrix.platform == 'macos' && inputs.build_macos) ||
          (matrix.platform == 'linux' && inputs.build_linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Ledgerly v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
